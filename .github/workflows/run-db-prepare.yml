name: Run db-prepare
run-name: >-
  db-prepare · ${{ inputs.server || 'auto' }} · ${{ inputs.ref || 'main' }} · @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      server:
        description: "Target server"
        required: true
        type: choice
        default: "auto"
        options:
          - "all"
          - "auto"
          - "preview"
          - "prod1"
          - "prod2"
      ref:
        description: "Studio ref to use (main for prod, other branches for preview)"
        required: false
        type: string
        default: "main"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ECR_REGISTRY: 912951144733.dkr.ecr.us-west-2.amazonaws.com

jobs:
  run-db-prepare:
    name: db-prepare · ${{ inputs.server || 'auto' }}
    runs-on: ubuntu-latest
    concurrency:
      group: db-prepare-${{ inputs.ref == 'main' && 'prod' || 'preview' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tonormal/studio
          token: ${{ secrets.STUDIO_ACCESS_TOKEN }}
          ref: ${{ inputs.ref || 'main' }}

      - name: Determine environment
        id: env
        run: |
          if [ "${{ inputs.ref || 'main' }}" = "main" ]; then
            echo "deploy_env=prod" >> $GITHUB_OUTPUT
            echo "param_path=/studio-prod/" >> $GITHUB_OUTPUT
          else
            echo "deploy_env=preview" >> $GITHUB_OUTPUT
            echo "param_path=/studio-dev/" >> $GITHUB_OUTPUT
          fi
          echo "ref=${{ inputs.ref || 'main' }}" >> $GITHUB_OUTPUT

      - name: Cache mise
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ hashFiles('.mise/config.toml') }}

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup mise
        run: |
          mise install

      - name: Cache Ansible Galaxy dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ansible/roles
            ~/.ansible/collections
          key: ansible-galaxy-${{ hashFiles('ansible/requirements.yml') }}

      - name: Install Ansible Galaxy dependencies
        run: |
          ansible-galaxy install -r ansible/requirements.yml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Validate inputs
        run: |
          if [ "${{ steps.env.outputs.deploy_env }}" = "preview" ]; then
            case "${{ inputs.server }}" in
              auto|preview) ;;
              *)
                echo "preview refs only support server=auto or server=preview"
                exit 1
                ;;
            esac
          elif [ "${{ inputs.server }}" = "preview" ]; then
            echo "server=preview requires a non-main ref"
            exit 1
          fi

      - name: Load SSH key from Parameter Store
        run: |
          DEPLOY_SSH_KEY=$(aws ssm get-parameter --name "${{ steps.env.outputs.param_path }}DEPLOY_SSH_KEY" --with-decryption --query "Parameter.Value" --output text)

          mkdir -p ~/.ssh
          echo "${DEPLOY_SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "SSH key loaded (env: ${{ steps.env.outputs.deploy_env }})"

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-west-2 | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Verify branch context for db-prepare
        run: |
          echo "inputs.ref=${{ inputs.ref || 'main' }}"
          echo "STUDIO_DEPLOY_REF=${STUDIO_DEPLOY_REF:-}"
          echo "github.ref_name=${{ github.ref_name }}"
          source scripts/build-lib.sh
          unset DEPLOY_ENV CURRENT_BRANCH BRANCH_CLEAN CTX_DB_SUFFIX CTX_DNS_SUFFIX CTX_ROOT_DOMAIN CTX_ENV_PREFIX AWS_PARAM_PATH ANSIBLE_TARGET
          detect_environment
          echo "Resolved branch: $CURRENT_BRANCH"
          echo "Resolved env: $DEPLOY_ENV"
          echo "Resolved DB suffix: $CTX_DB_SUFFIX"
          if [ "${{ steps.env.outputs.deploy_env }}" = "preview" ] \
             && [ -z "${CTX_DB_SUFFIX:-}" ] \
             && ! is_default_preview_branch_name "$CURRENT_BRANCH"; then
            echo "Preview deployment resolved without CTX_DB_SUFFIX"
            exit 1
          fi
        env:
          STUDIO_DEPLOY_REF: ${{ inputs.ref || github.ref_name }}

      - name: Run db-prepare
        run: |
          SERVER="${{ inputs.server }}"
          if [ "$SERVER" = "auto" ]; then
            mise run deploy-db-prepare
          elif [ "$SERVER" = "preview" ]; then
            mise run deploy-db-prepare
          elif [ "$SERVER" = "all" ]; then
            echo "Running db-prepare on all active prod servers..."
            SERVERS=$(grep -A 100 "prod_servers:" ansible/inventory.yml | grep -E "^\s+prod[0-9]+:" | sed 's/://g' | awk '{print $1}')
            for srv in $SERVERS; do
              echo "Running db-prepare on $srv..."
              mise run deploy-db-prepare "$srv"
            done
          else
            mise run deploy-db-prepare "$SERVER"
          fi
        env:
          ANSIBLE_SSH_PRIVATE_KEY_FILE: ~/.ssh/id_rsa
          STUDIO_DEPLOY_REF: ${{ inputs.ref || github.ref_name }}

      - name: Summary
        if: always()
        run: |
          echo "### db-prepare Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: \`${{ steps.env.outputs.deploy_env }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: \`${{ steps.env.outputs.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Server: \`${{ inputs.server }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
