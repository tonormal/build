name: Deploy Infrastructure

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Infrastructure service to deploy"
        required: true
        type: choice
        options:
          - "all"
          - "postgres"
          - "redis"
          - "caddy"
          - "backup"
      ref:
        description: "Studio ref to deploy (main for prod, other branches for preview)"
        required: false
        type: string
        default: "main"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  ECR_REGISTRY: 912951144733.dkr.ecr.us-west-2.amazonaws.com

jobs:
  deploy-infra:
    runs-on: ubuntu-latest
    steps:
      - name: Determine environment
        id: env
        run: |
          BRANCH="${{ inputs.ref || 'main' }}"
          if [ "$BRANCH" = "main" ]; then
            echo "deploy_env=prod" >> $GITHUB_OUTPUT
            echo "param_path=/studio-prod/" >> $GITHUB_OUTPUT
          else
            echo "deploy_env=preview" >> $GITHUB_OUTPUT
            echo "param_path=/studio-dev/" >> $GITHUB_OUTPUT
          fi
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          repository: tonormal/studio
          token: ${{ secrets.STUDIO_ACCESS_TOKEN }}
          ref: ${{ inputs.ref || 'main' }}

      - name: Cache mise
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ hashFiles('.mise/config.toml') }}

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup mise
        run: |
          mise install

      - name: Cache Ansible Galaxy dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ansible/roles
            ~/.ansible/collections
          key: ansible-galaxy-${{ hashFiles('ansible/requirements.yml') }}

      - name: Install Ansible Galaxy dependencies
        run: |
          ansible-galaxy install -r ansible/requirements.yml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Validate inputs
        run: |
          if [ "${{ steps.env.outputs.deploy_env }}" != "prod" ] && [ "${{ inputs.service }}" = "backup" ]; then
            echo "backup service is production-only; choose ref=main or a different service"
            exit 1
          fi

      - name: Load SSH key from Parameter Store
        run: |
          DEPLOY_SSH_KEY=$(aws ssm get-parameter --name "${{ steps.env.outputs.param_path }}DEPLOY_SSH_KEY" --with-decryption --query "Parameter.Value" --output text)

          mkdir -p ~/.ssh
          echo "${DEPLOY_SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "SSH key loaded (env: ${{ steps.env.outputs.deploy_env }})"

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-west-2 | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Sync server config
        run: mise run sync-config
        env:
          ANSIBLE_SSH_PRIVATE_KEY_FILE: ~/.ssh/id_rsa
          STUDIO_DEPLOY_REF: ${{ inputs.ref || github.ref_name }}

      - name: Deploy infrastructure
        run: |
          if [ "${{ inputs.service }}" = "all" ]; then
            mise run deploy-infra
          else
            mise run deploy-${{ inputs.service }}
          fi
        env:
          ANSIBLE_SSH_PRIVATE_KEY_FILE: ~/.ssh/id_rsa
          STUDIO_DEPLOY_REF: ${{ inputs.ref || github.ref_name }}

      - name: Deployment summary
        if: always()
        run: |
          echo "### Infrastructure Deployment Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: \`${{ steps.env.outputs.deploy_env }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Ref: \`${{ steps.env.outputs.branch }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Service: \`${{ inputs.service }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
