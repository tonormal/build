name: Sync Caddy
run-name: >-
  Caddy · ${{ github.event.client_payload.deploy_ref || github.event.client_payload.head_ref || inputs.ref || github.ref_name || 'main' }} · @${{ github.actor }}

on:
  # Push/PR 触发由 studio 的 relay-reload-caddy.yml 转发
  repository_dispatch:
    types: [reload-caddy]

  workflow_dispatch:
    inputs:
      ref:
        description: "Studio ref to use (main for prod, other branches for preview)"
        required: false
        type: string
        default: "main"

concurrency:
  group: deploy-caddy-${{ github.event.client_payload.sha || github.sha }}
  cancel-in-progress: false

env:
  ECR_REGISTRY: 912951144733.dkr.ecr.us-west-2.amazonaws.com

jobs:
  sync-caddy:
    name: Sync Caddy
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.env.outputs.deploy_env }}
      operation: ${{ steps.env.outputs.operation }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tonormal/studio
          token: ${{ secrets.STUDIO_ACCESS_TOKEN }}
          ref: ${{ github.event.client_payload.sha || inputs.ref || 'main' }}

      - name: Determine environment
        id: env
        run: |
          DEPLOY_REF="${{ github.event.client_payload.deploy_ref || github.event.client_payload.head_ref || inputs.ref || github.ref_name }}"
          ORIG_EVENT="${{ github.event_name }}"
          if [ "$ORIG_EVENT" = "repository_dispatch" ]; then
            ORIG_EVENT="${{ github.event.client_payload.event_name }}"
          fi

          if [ "$ORIG_EVENT" = "pull_request" ]; then
            BRANCH="$DEPLOY_REF"
            DEPLOY_ENV="preview"
            PARAM_PATH="/studio-dev/"
            OPERATION="deploy"
          elif [ "${{ github.event.client_payload.ref }}" = "refs/heads/main" ]; then
            BRANCH="main"
            DEPLOY_ENV="prod"
            PARAM_PATH="/studio-prod/"
            OPERATION="deploy"
          else
            BRANCH="$DEPLOY_REF"
            if [ "$BRANCH" = "main" ]; then
              DEPLOY_ENV="prod"
              PARAM_PATH="/studio-prod/"
            else
              DEPLOY_ENV="preview"
              PARAM_PATH="/studio-dev/"
            fi
            OPERATION="reload"
          fi

          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "deploy_env=$DEPLOY_ENV" >> $GITHUB_OUTPUT
          echo "param_path=$PARAM_PATH" >> $GITHUB_OUTPUT
          echo "operation=$OPERATION" >> $GITHUB_OUTPUT
          echo "Environment: $DEPLOY_ENV"
          echo "Branch: $BRANCH"
          echo "Operation: $OPERATION"

      - name: Cache mise
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ hashFiles('.mise/config.toml') }}

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup mise
        run: |
          mise install

      - name: Cache Ansible Galaxy dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ansible/roles
            ~/.ansible/collections
          key: ansible-galaxy-${{ hashFiles('ansible/requirements.yml') }}

      - name: Install Ansible Galaxy dependencies
        run: |
          ansible-galaxy install -r ansible/requirements.yml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Load SSH key from Parameter Store
        run: |
          DEPLOY_SSH_KEY=$(aws ssm get-parameter --name "${{ steps.env.outputs.param_path }}DEPLOY_SSH_KEY" --with-decryption --query "Parameter.Value" --output text)

          mkdir -p ~/.ssh
          echo "${DEPLOY_SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "SSH key loaded (env: ${{ steps.env.outputs.deploy_env }})"

      - name: Sync Caddy
        run: |
          if [ "${{ steps.env.outputs.operation }}" = "deploy" ]; then
            mise run deploy-caddy
          else
            mise run reload-caddy
          fi
        env:
          ANSIBLE_SSH_PRIVATE_KEY_FILE: ~/.ssh/id_rsa
          STUDIO_DEPLOY_REF: ${{ github.event.client_payload.deploy_ref || github.event.client_payload.head_ref || inputs.ref || github.ref_name }}

      - name: Summary
        if: always()
        run: |
          echo "### Caddy Sync" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: \`${{ steps.env.outputs.deploy_env }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Operation: \`${{ steps.env.outputs.operation }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.event.client_payload.sha || github.sha }}\`" >> $GITHUB_STEP_SUMMARY
