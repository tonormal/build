name: Deploy Applications
run-name: >-
  Apps · ${{ github.event.client_payload.target || inputs.target || 'auto' }} ·
  ${{ github.event.client_payload.deploy_ref || github.event.client_payload.head_ref || inputs.ref || github.ref_name || 'main' }} ·
  @${{ github.actor }}

on:
  # Push/PR 触发由 studio 的 relay-deploy-apps.yml 转发
  repository_dispatch:
    types: [deploy-apps]

  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target"
        required: true
        type: choice
        options:
          - "all"
          - "auto"
          - "hono-demo"
          - "proxy"
          - "blog"
          - "storefront"
          - "admin"
          - "api"
      ref:
        description: "Studio ref to deploy (main for prod, other branches for preview)"
        required: false
        type: string
        default: "main"

concurrency:
  group: deploy-apps-${{ github.event.client_payload.sha || github.sha }}
  cancel-in-progress: false

env:
  ECR_REGISTRY: 912951144733.dkr.ecr.us-west-2.amazonaws.com

jobs:
  detect:
    name: Detect · ${{ github.event.client_payload.target || inputs.target || 'auto' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      deploy_env: ${{ steps.set-env.outputs.deploy_env }}
      branch_clean: ${{ steps.set-env.outputs.branch_clean }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tonormal/studio
          token: ${{ secrets.STUDIO_ACCESS_TOKEN }}
          fetch-depth: 0
          ref: ${{ github.event.client_payload.sha || inputs.ref || 'main' }}

      - name: Determine deployment environment
        id: set-env
        run: |
          DEPLOY_REF="${{ github.event.client_payload.deploy_ref || github.event.client_payload.head_ref || inputs.ref || github.ref_name }}"
          ORIG_EVENT="${{ github.event_name }}"
          if [ "$ORIG_EVENT" = "repository_dispatch" ]; then
            ORIG_EVENT="${{ github.event.client_payload.event_name }}"
          fi

          if [ "$ORIG_EVENT" = "pull_request" ]; then
            BRANCH="$DEPLOY_REF"
            DEPLOY_ENV="preview"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BRANCH="$DEPLOY_REF"
            if [ "$BRANCH" = "main" ]; then
              DEPLOY_ENV="prod"
            else
              DEPLOY_ENV="preview"
            fi
          elif [ "${{ github.event.client_payload.ref }}" = "refs/heads/main" ]; then
            BRANCH="main"
            DEPLOY_ENV="prod"
          else
            BRANCH="$DEPLOY_REF"
            DEPLOY_ENV="preview"
          fi

          BRANCH_CLEAN=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]' | cut -c1-30)

          echo "deploy_env=$DEPLOY_ENV" >> $GITHUB_OUTPUT
          echo "branch_clean=$BRANCH_CLEAN" >> $GITHUB_OUTPUT
          echo "Deploy environment: $DEPLOY_ENV"
          echo "Branch: $BRANCH (clean: $BRANCH_CLEAN)"

      - name: Detect changed services
        id: detect-changes
        run: |
          ALL_SERVICES=$(ls -1 js-apps | tr '\n' ' ')
          echo "All services: $ALL_SERVICES"

          ORIG_EVENT="${{ github.event_name }}"
          if [ "$ORIG_EVENT" = "repository_dispatch" ]; then
            ORIG_EVENT="${{ github.event.client_payload.event_name }}"
          fi

          if [ "$ORIG_EVENT" = "pull_request" ]; then
            BASE_SHA="${{ github.event.client_payload.base_sha }}"
            HEAD_SHA="${{ github.event.client_payload.sha }}"
            CHANGED_FILES=$(git diff --name-only ${BASE_SHA}...${HEAD_SHA} 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          elif [ "$ORIG_EVENT" = "push" ]; then
            BEFORE="${{ github.event.client_payload.before }}"
            AFTER="${{ github.event.client_payload.sha }}"
            CHANGED_FILES=$(git diff --name-only ${BEFORE} ${AFTER} 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          SHARED_CHANGED="false"
          if echo "$CHANGED_FILES" | grep -q "^js-packages/"; then
            SHARED_CHANGED="true"
            echo "Shared packages changed: true"
          fi

          CHANGED_SERVICES=""
          for svc in $ALL_SERVICES; do
            if echo "$CHANGED_FILES" | grep -q "^js-apps/$svc/"; then
              CHANGED_SERVICES="$CHANGED_SERVICES $svc"
              echo "Service changed: $svc"
            fi
          done

          echo "all_services=$ALL_SERVICES" >> $GITHUB_OUTPUT
          echo "changed_services=$CHANGED_SERVICES" >> $GITHUB_OUTPUT
          echo "shared_changed=$SHARED_CHANGED" >> $GITHUB_OUTPUT

      - name: Set deployment matrix
        id: set-matrix
        run: |
          ALL_SERVICES="${{ steps.detect-changes.outputs.all_services }}"
          CHANGED_SERVICES="${{ steps.detect-changes.outputs.changed_services }}"
          SHARED_CHANGED="${{ steps.detect-changes.outputs.shared_changed }}"
          ORIG_EVENT="${{ github.event_name }}"
          if [ "$ORIG_EVENT" = "repository_dispatch" ]; then
            ORIG_EVENT="${{ github.event.client_payload.event_name }}"
          fi

          check_server_configured() {
            local server="$1"
            if grep -E "^\s+${server}:" ansible/inventory.yml > /dev/null 2>&1; then
              return 0
            fi
            return 1
          }

          get_deploy_server() {
            local svc="$1"
            local env_file="js-apps/${svc}/.env.tpl"
            if [ -f "$env_file" ]; then
              grep -E "^DEPLOY_SERVER=" "$env_file" 2>/dev/null | cut -d'=' -f2 | tr -d '"' || true
            fi
          }

          if [ "$ORIG_EVENT" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.client_payload.target || inputs.target }}"

            if [ "$TARGET" = "all" ]; then
              DEPLOY_SERVICES="$ALL_SERVICES"
            elif [ "$TARGET" = "auto" ]; then
              if [ "$SHARED_CHANGED" = "true" ]; then
                DEPLOY_SERVICES="$ALL_SERVICES"
              else
                DEPLOY_SERVICES="$CHANGED_SERVICES"
              fi
            else
              DEPLOY_SERVICES="$TARGET"
            fi
          else
            if [ "$SHARED_CHANGED" = "true" ]; then
              DEPLOY_SERVICES="$ALL_SERVICES"
              echo "Shared packages changed, deploying all services"
            else
              DEPLOY_SERVICES="$CHANGED_SERVICES"
              echo "Deploying only changed services"
            fi
          fi

          DEPLOY_SERVICES=$(echo "$DEPLOY_SERVICES" | xargs)

          FILTERED_SERVICES=""
          for svc in $DEPLOY_SERVICES; do
            deploy_server=$(get_deploy_server "$svc")
            if [ -n "$deploy_server" ] && ! check_server_configured "$deploy_server"; then
              echo "Skipping $svc (target server '$deploy_server' not configured)"
            else
              FILTERED_SERVICES="$FILTERED_SERVICES $svc"
            fi
          done
          DEPLOY_SERVICES=$(echo "$FILTERED_SERVICES" | xargs)

          if [ -z "$DEPLOY_SERVICES" ]; then
            MATRIX='{"include":[]}'
            echo "No services to deploy"
          else
            MATRIX_ITEMS=$(echo $DEPLOY_SERVICES | tr ' ' '\n' | sed 's/.*/{\"service\":\"&\"}/' | paste -sd ',' -)
            MATRIX="{\"include\":[${MATRIX_ITEMS}]}"
            echo "Services to deploy: $DEPLOY_SERVICES"
          fi

          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "Deployment matrix: ${MATRIX}"

  db-prepare:
    name: DB Prepare · ${{ needs.detect.outputs.deploy_env }}
    needs: detect
    if: needs.detect.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    concurrency:
      group: db-prepare-${{ needs.detect.outputs.deploy_env }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tonormal/studio
          token: ${{ secrets.STUDIO_ACCESS_TOKEN }}
          ref: ${{ github.event.client_payload.sha || inputs.ref || 'main' }}

      - name: Cache mise
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ hashFiles('.mise/config.toml') }}

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup mise
        run: |
          mise install

      - name: Cache Ansible Galaxy dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ansible/roles
            ~/.ansible/collections
          key: ansible-galaxy-${{ hashFiles('ansible/requirements.yml') }}

      - name: Install Ansible Galaxy dependencies
        run: |
          ansible-galaxy install -r ansible/requirements.yml

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Load SSH key from Parameter Store
        run: |
          if [ "${{ needs.detect.outputs.deploy_env }}" = "prod" ]; then
            PARAM_PATH="/studio-prod/"
          else
            PARAM_PATH="/studio-dev/"
          fi

          DEPLOY_SSH_KEY=$(aws ssm get-parameter --name "${PARAM_PATH}DEPLOY_SSH_KEY" --with-decryption --query "Parameter.Value" --output text)

          mkdir -p ~/.ssh
          echo "${DEPLOY_SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "SSH key loaded (env: ${{ needs.detect.outputs.deploy_env }})"

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-west-2 | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Verify branch context for db-prepare
        run: |
          echo "client_payload.deploy_ref=${{ github.event.client_payload.deploy_ref || '' }}"
          echo "client_payload.head_ref=${{ github.event.client_payload.head_ref || '' }}"
          echo "STUDIO_DEPLOY_REF=${STUDIO_DEPLOY_REF:-}"
          echo "github.ref_name=${{ github.ref_name }}"
          source scripts/build-lib.sh
          unset DEPLOY_ENV CURRENT_BRANCH BRANCH_CLEAN CTX_DB_SUFFIX CTX_DNS_SUFFIX CTX_ROOT_DOMAIN CTX_ENV_PREFIX AWS_PARAM_PATH ANSIBLE_TARGET
          detect_environment
          echo "Resolved branch: $CURRENT_BRANCH"
          echo "Resolved env: $DEPLOY_ENV"
          echo "Resolved DB suffix: $CTX_DB_SUFFIX"
          if [ "${{ needs.detect.outputs.deploy_env }}" = "preview" ] && [ -z "${CTX_DB_SUFFIX:-}" ]; then
            echo "Preview deployment resolved without CTX_DB_SUFFIX"
            exit 1
          fi
        env:
          STUDIO_DEPLOY_REF: ${{ github.event.client_payload.deploy_ref || github.event.client_payload.head_ref || inputs.ref || github.ref_name }}

      - name: Run db-prepare (ensure databases exist)
        run: |
          mise run deploy-db-prepare
        env:
          ANSIBLE_SSH_PRIVATE_KEY_FILE: ~/.ssh/id_rsa
          STUDIO_DEPLOY_REF: ${{ github.event.client_payload.deploy_ref || github.event.client_payload.head_ref || inputs.ref || github.ref_name }}

  deploy:
    needs: [detect, db-prepare]
    if: needs.detect.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          repository: tonormal/studio
          token: ${{ secrets.STUDIO_ACCESS_TOKEN }}
          ref: ${{ github.event.client_payload.sha || inputs.ref || 'main' }}

      - name: Cache mise
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise
          key: mise-${{ runner.os }}-${{ hashFiles('.mise/config.toml') }}

      - name: Install mise
        run: |
          curl https://mise.run | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup mise
        run: |
          mise install

      - name: Cache Ansible Galaxy dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.ansible/roles
            ~/.ansible/collections
          key: ansible-galaxy-${{ hashFiles('ansible/requirements.yml') }}

      - name: Install Ansible Galaxy dependencies
        run: |
          ansible-galaxy install -r ansible/requirements.yml

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.CI_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CI_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Load SSH key from Parameter Store
        run: |
          if [ "${{ needs.detect.outputs.deploy_env }}" = "prod" ]; then
            PARAM_PATH="/studio-prod/"
          else
            PARAM_PATH="/studio-dev/"
          fi

          DEPLOY_SSH_KEY=$(aws ssm get-parameter --name "${PARAM_PATH}DEPLOY_SSH_KEY" --with-decryption --query "Parameter.Value" --output text)

          mkdir -p ~/.ssh
          echo "${DEPLOY_SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "SSH key loaded (env: ${{ needs.detect.outputs.deploy_env }})"

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-west-2 | \
            docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}

      - name: Deploy ${{ matrix.service }}
        run: |
          mise run deploy-${{ matrix.service }}
        env:
          DOCKER_BUILDKIT: 1
          BUILDKIT_PROGRESS: plain
          ANSIBLE_SSH_PRIVATE_KEY_FILE: ~/.ssh/id_rsa
          STUDIO_DEPLOY_REF: ${{ github.event.client_payload.deploy_ref || github.event.client_payload.head_ref || inputs.ref || github.ref_name }}

      - name: Run post-deploy hook
        if: hashFiles(format('js-apps/{0}/post-deploy.sh', matrix.service)) != ''
        run: |
          echo "Running post-deploy for ${{ matrix.service }}..."
          mise run post-deploy-${{ matrix.service }}

      - name: Deployment summary
        if: always()
        run: |
          SERVICE="${{ matrix.service }}"
          DEPLOY_ENV="${{ needs.detect.outputs.deploy_env }}"
          SUMMARY_FILE="js-apps/${SERVICE}/deploy-dist/DEPLOY_SUMMARY.txt"

          echo "### Deployment Result: ${SERVICE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "$SUMMARY_FILE" ]; then
            echo "**URLs:**" >> $GITHUB_STEP_SUMMARY
            while IFS= read -r url; do
              echo "- [${url}](${url})" >> $GITHUB_STEP_SUMMARY
            done < "$SUMMARY_FILE"
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          echo "- Service: \`${SERVICE}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: \`${DEPLOY_ENV}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.event.client_payload.sha || github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload deploy summary
        if: |
          github.event_name == 'repository_dispatch' &&
          github.event.client_payload.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: deploy-summary-${{ matrix.service }}
          path: js-apps/${{ matrix.service }}/deploy-dist/DEPLOY_SUMMARY.txt
          if-no-files-found: ignore
          retention-days: 1

  comment:
    needs: [detect, deploy]
    if: |
      github.event_name == 'repository_dispatch' &&
      github.event.client_payload.event_name == 'pull_request' &&
      needs.detect.outputs.deploy_env == 'preview'
    runs-on: ubuntu-latest
    steps:
      - name: Download deploy summaries
        uses: actions/download-artifact@v4
        with:
          pattern: deploy-summary-*
          path: summaries
          merge-multiple: false

      - name: Comment preview URLs on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.STUDIO_ACCESS_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');
            const branchClean = '${{ needs.detect.outputs.branch_clean }}';
            const matrix = ${{ needs.detect.outputs.matrix }};
            const services = matrix.include.map(item => item.service);
            const prNumber = parseInt('${{ github.event.client_payload.pr_number }}');

            const urlLines = [];
            for (const service of services) {
              const summaryPath = path.join('summaries', `deploy-summary-${service}`, 'DEPLOY_SUMMARY.txt');
              try {
                const content = fs.readFileSync(summaryPath, 'utf8').trim();
                const urls = content.split('\n').filter(u => u.length > 0);
                if (urls.length === 1) {
                  urlLines.push(`- **${service}**: ${urls[0]}`);
                } else {
                  urlLines.push(`- **${service}**:`);
                  urls.forEach(url => urlLines.push(`  - ${url}`));
                }
              } catch (e) {
                urlLines.push(`- **${service}**: https://${service}--${branchClean}.preview.owenyoung.com`);
              }
            }

            const body = `## Preview Deployment

            Your changes have been deployed to the preview environment!

            ### Preview URLs
            ${urlLines.join('\n')}

            ### Details
            - **Branch**: \`${{ github.event.client_payload.deploy_ref || github.event.client_payload.head_ref }}\`
            - **Commit**: \`${{ github.event.client_payload.sha }}\`
            - **Environment**: preview

            > Preview environments are automatically cleaned up when the PR is merged or closed.
            > Use \`mise run preview-delete ${branchClean}\` to manually clean up.
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: 'tonormal',
              repo: 'studio',
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview Deployment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: 'tonormal',
                repo: 'studio',
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: 'tonormal',
                repo: 'studio',
                issue_number: prNumber,
                body: body
              });
            }
